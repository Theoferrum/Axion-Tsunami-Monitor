<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Test</title>
  <style>
    body {
      background: #0b0f19;
      color: #e2e8f0;
      font-family: system-ui, sans-serif;
      padding: 20px;
      line-height: 1.5;
    }
    #result {
      background: #161f33;
      border: 1px solid #24355a;
      border-radius: 8px;
      padding: 15px;
      white-space: pre-wrap;
      font-size: 14px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <h2>Free News API Test</h2>
  <div id="result">Running test…</div>

  <script>
    const API_KEY = 'fna_live_JFDr8nDD5_FE3EZD-meQmgpchXugZ220TTivLYZwFes';  // ← put your real key here

    async function test() {
      const el = document.getElementById('result');
      el.textContent = 'Sending request…';

      try {
        const res = await fetch(
          'https://freenewsapi.ai/v1/search?q=earthquake&date=24h&size=1',
          {
            headers: {
              'Authorization': 'Bearer ' + API_KEY
            }
          }
        );

        const text = await res.text();
        el.textContent = 
          'HTTP Status: ' + res.status + '\n\n' +
          'Response:\n' + text;
      } catch (err) {
        el.textContent = 'ERROR:\n' + err.message;
      }
    }

    test();
  </script>
</body>
</html>
